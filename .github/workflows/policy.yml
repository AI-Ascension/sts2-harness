name: Repository policy

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: policy-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  policy:
    name: policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt --no-self-update

      - name: Test repository policy tool
        run: cargo test --locked --package repo-policy

      # The execution gate is what stands between a renamed or dropped test and a
      # green empty lane run, and its own accounting is only ever read when a lane
      # is already red. Test it here, on a workflow that runs on every PR, rather
      # than leaving it to the next lane that trips it (sts2-harness#540).
      - name: Self-test the exact execution gate
        run: bash tools/exact-gate-selftest.sh

      - name: Enforce repository policy
        run: cargo run --locked --package repo-policy -- --strict
