name: Review of record

on:
  pull_request:
    # Re-run whenever the head moves, so a push after the last review unpins
    # that review and turns the check red again on the head that would merge.
    types: [opened, synchronize, reopened, ready_for_review, edited]
  pull_request_review:
    # Re-run when a review lands, so a PR that opened with no review of record
    # turns green when it gets one instead of waiting for the next push.
    types: [submitted, edited, dismissed]
  workflow_dispatch:
    inputs:
      number:
        description: Pull request number to evaluate
        required: true
        # `number`, not `string`. GitHub coerces this to an integer before the
        # workflow runs, so a value like `$(echo ...` cannot reach the `run:`
        # block below as text. `run:` interpolates `${{ }}` into a shell
        # script, and surrounding double quotes do NOT neutralise `$(...)` or
        # backticks. With `type: string` a workflow_dispatch caller could
        # inject shell into a job that holds a token. `workflow_dispatch`
        # already requires write access, so the practical severity was low --
        # but the input does not need to be a string, so it should not be one.
        type: number

permissions:
  contents: read
  pull-requests: read

# This block is queue hygiene, not a fix for a proven merge block. It is here
# because the gate triggers on `pull_request` as well as `pull_request_review`,
# and without a group a slow push-triggered run overlaps the review-triggered
# run for the same head instead of yielding to it.
#
# What this block does NOT do, stated here because the opposite was previously
# recorded in this file and in #729: it cannot clear a completed red run. A
# concurrency group governs runs that are not yet dispatched or are still
# running, so it has no effect on a run that has already completed.
#
# An earlier version of this comment went further and asserted a
# check-resolution rule from that fact: that under ruleset 24104281
# (`strict_required_status_checks_policy: false`) a completed red run for a
# required context is NOT superseded by a later green run of the same context.
# That rule is contradicted by this repository's own merges and should not be
# relied on. PR #710 merged at 92232e2a on 2026-09-28T08:28:36Z, with the
# ruleset already active (created 07:59:06Z, no bypass actors). Its head
# fc3b1d4f carried a completed FAILING `review-of-record` run (108844282103,
# completed 08:18:57) and a completed failing check-suite (98547418364) next to
# two later completed green runs of the same context (08:19:27, 08:19:54). The
# merge succeeded, and that failing run was never re-run -- run 36396574820 is
# still run_attempt=1, conclusion=failure.
#
# The head cited as evidence for that rule, 86712e4f, does not support it
# either. Its red completed at 15:29:07Z and a green completed at 15:44:48Z, but
# the `blocked` state was observed at 15:44:10Z -- 38 seconds BEFORE the green
# completed, when the red was still the only completed run of the context. The
# red was then rewritten in place at 15:47:54Z, 49 seconds before the merge. No
# merge attempt was ever refused after a green run had completed on that head.
#
# So a later green run of the same context does supersede the red on its own,
# and the `gh run rerun --failed` used in the incidents above was a convenience
# rather than a necessity. It is still the fastest way to clear a red when
# debugging a merge that will not go, because it rewrites the run's conclusion
# in place (attempt 1 failure -> attempt 2 success) rather than waiting on a
# new run to be dispatched and finish.
#
# `strict_required_status_checks_policy: true` is the setting that would make
# the newest run authoritative; it is untested here and is the ruleset owner's
# call.
#
# Keying the group on the head SHA is deliberate. Keyed on the PR number alone, a
# push would cancel in-flight runs belonging to the *previous* head, throwing
# away work that is still valid. With the SHA in the key, a push only ever
# supersedes its own earlier run.
#
# `cancel-in-progress` is keyed on the event name so a review submission is
# never cancelled by an unrelated push. This workflow's green path IS the
# `pull_request_review` trigger, so cancelling one would strand the check red.
# Only a push (a genuinely superseded head) cancels.
concurrency:
  group: review-of-record-${{ github.event.pull_request.number || github.event.review.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.event.review.pull_request.head.sha || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  review-of-record:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Run the gate from the DEFAULT BRANCH, never from the pull request.
          #
          # The gate reads the head SHA and the review list from the API; it
          # needs no code from the pull request at all. Checking out the PR head
          # would mean executing code the pull request controls, with a token
          # in the job -- so a PR that edits both `tools/review-gate/src/main.rs`
          # and `tools/review-gate/src/tests.rs` could make the gate pass itself
          # with zero reviews. Pinning the checkout removes that class entirely
          # and costs nothing: everything the gate evaluates comes from the API.
          #
          # It is pinned to the default branch, so the gate that runs is the one
          # already on `main` -- including the unit tests below, which are run
          # from that same checkout for the same reason.
          #
          # This is legal on `pull_request` (unlike `pull_request_target`),
          # which is why the gate is not guarded by the
          # `github.ref == default_branch` condition that `metadata-drift.yml`
          # uses -- that workflow only reports, so it can wait for a trusted
          # ref, while this one must answer on every pull request.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Test the review gate
        # The gate itself is a Rust workspace tool, so this repository's LANG001
        # rule ("Python source is prohibited; repository tooling is Rust") holds:
        # the reference implementation in AI-Ascension/.github is ported rather
        # than vendored. These are its own tests, ported case for case.
        run: cargo test -p sts2-review-gate --locked
      - name: Require a review pinned to the pull-request head
        # Reviews live on the base repository even when the head is a fork, so
        # this always reads `github.repository` and never the head repo.
        # `github.token` on a `pull_request` event is a read-only token scoped
        # to the pull request, which is all this read needs.
        #
        # The PR number is read from `github.event.pull_request.number` on
        # `pull_request`, and from `github.event.review.pull_request.number` on
        # `pull_request_review` -- that event has no `github.event.pull_request`
        # context at all. Resolving both here keeps the trigger honest: without
        # the second expression this step would pass an empty `--number` and
        # argparse would exit 2 on every review submission.
        #
        # `--number` is parsed as int by argparse, so an unresolved value is a
        # hard error rather than a silent zero. If the number cannot be
        # resolved the job fails, which is the intended fail-closed direction.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number="${{ inputs.number || github.event.pull_request.number || github.event.review.pull_request.number }}"
          if [ -z "$number" ]; then
            echo "::error::could not resolve a pull-request number from this event"
            exit 1
          fi
          cargo run -p sts2-review-gate --locked --release -- \
            --repository "${{ github.repository }}" \
            --number "$number"
