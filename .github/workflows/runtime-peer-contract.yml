name: Runtime peer contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      gateway_revision:
        description: Exact 40-hex gateway candidate revision (optional coordinated-pair override)
        required: false
        type: string
      mcp_revision:
        description: Exact 40-hex MCP candidate revision (optional coordinated-pair override)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: runtime-peer-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  runtime-peer-contract:
    name: Candidate harness against pinned runtime peers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      DEFAULT_GATEWAY_REVISION: 3692f4d60fff06b8b4e1a44b14449dec6f30d67c
      DEFAULT_MCP_REVISION: e6af39f30c14cd5ecc84be254511d4840bdb8fae
      # Peer binaries are identical for every executable-composition step, so they are declared once
      # here. Only `github`/`vars`/`secrets`/`inputs` are readable in a job-level env, so each step
      # still names its own `runner.temp` evidence directory.
      STS2_GATEWAY_BINARY: ${{ github.workspace }}/gateway/target/debug/sts2-gateway-runtime
      STS2_MCP_BINARY: ${{ github.workspace }}/mcp/target/debug/sts2-mcp-server
      STS2_HARNESS_RUNTIME_BINARY: ${{ github.workspace }}/harness/target/debug/sts2-harness-runtime
    steps:
      - name: Check out candidate harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: harness
          persist-credentials: false

      - name: Resolve explicit immutable peer revisions
        id: peers
        env:
          INPUT_GATEWAY_REVISION: ${{ inputs.gateway_revision }}
          INPUT_MCP_REVISION: ${{ inputs.mcp_revision }}
        run: |
          choose_revision() {
            supplied="$1"
            fallback="$2"
            if test -z "$supplied"; then
              printf '%s' "$fallback"
              return
            fi
            printf '%s' "$supplied" | grep -Eq '^[0-9a-f]{40}$'
            printf '%s' "$supplied"
          }
          gateway_revision=$(choose_revision "$INPUT_GATEWAY_REVISION" "$DEFAULT_GATEWAY_REVISION")
          mcp_revision=$(choose_revision "$INPUT_MCP_REVISION" "$DEFAULT_MCP_REVISION")
          printf 'gateway_revision=%s\n' "$gateway_revision" >> "$GITHUB_OUTPUT"
          printf 'mcp_revision=%s\n' "$mcp_revision" >> "$GITHUB_OUTPUT"

      - name: Check out exact gateway peer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AI-Ascension/sts2-gateway
          ref: ${{ steps.peers.outputs.gateway_revision }}
          path: gateway
          persist-credentials: false

      - name: Check out exact MCP peer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AI-Ascension/sts2-mcp-server
          ref: ${{ steps.peers.outputs.mcp_revision }}
          path: mcp
          persist-credentials: false

      - name: Verify peer revisions and lane declaration
        working-directory: harness
        env:
          GATEWAY_REVISION: ${{ steps.peers.outputs.gateway_revision }}
          MCP_REVISION: ${{ steps.peers.outputs.mcp_revision }}
        run: |
          test "$(git -C ../gateway rev-parse HEAD)" = "$GATEWAY_REVISION"
          test "$(git -C ../mcp rev-parse HEAD)" = "$MCP_REVISION"
          test -f contracts/runtime-peer-lane.json
          grep -Fq 'active_runtime_dependency' contracts/runtime-peer-lane.json

      - name: Build candidate and immutable runtime peers
        run: |
          cargo build --locked -j 2 --manifest-path harness/Cargo.toml --bin sts2-harness-runtime
          cargo build --locked -j 2 --manifest-path gateway/Cargo.toml --bin sts2-gateway-runtime
          cargo build --locked -j 2 --manifest-path mcp/Cargo.toml --bin sts2-mcp-server

      - name: Exercise generic runtime composition and deliberate envelope mismatch
        working-directory: harness
        env:
          STS2_EXECUTABLE_COMPOSITION_EVIDENCE_DIR: ${{ runner.temp }}/runtime-peer-contract
        run: $GITHUB_WORKSPACE/harness/tools/exact-gate.sh - cargo test --locked -j 2 --package sts2-harness --test runtime_v4_executable_composition -- --ignored --exact executable_runtime_v4_composes_unknown_reconcile_and_foreign_state_fence

      - name: Exercise executable REST selector composition
        working-directory: harness
        env:
          # write_evidence writes result.json; keep it out of the generic step's directory.
          STS2_EXECUTABLE_COMPOSITION_EVIDENCE_DIR: ${{ runner.temp }}/runtime-peer-contract/rest
        run: |
          "$GITHUB_WORKSPACE/harness/tools/exact-gate.sh" - cargo test --locked -j 2 --package sts2-harness --test runtime_v4_rest_executable_composition -- --ignored --exact executable_runtime_v4_rest_composes_full_selection_recovery_chain
          "$GITHUB_WORKSPACE/harness/tools/exact-gate.sh" - cargo test --locked -j 2 --package sts2-harness --test runtime_v4_rest_executable_composition -- --ignored --exact executable_runtime_v4_rest_composes_native_selector_id_chain

      - name: Exercise served policy routes, settled action, and idle-adoption rebind
        working-directory: harness
        run: |
          "$GITHUB_WORKSPACE/harness/tools/exact-gate.sh" - cargo test --locked -j 2 --package sts2-harness --test runtime_v4_executable_composition -- --ignored --exact served_workflow_settles_action_with_adopted_provider_policy
          "$GITHUB_WORKSPACE/harness/tools/exact-gate.sh" - cargo test --locked -j 2 --package sts2-harness --test runtime_v4_executable_composition -- --ignored --exact served_decision_survives_changed_policy_adopted_while_idle

      - name: Exercise served unknown-effect restart refusal
        working-directory: harness
        run: $GITHUB_WORKSPACE/harness/tools/exact-gate.sh - cargo test --locked -j 2 --package sts2-harness --test runtime_v4_executable_composition -- --ignored --exact served_restart_refuses_unknown_effect_without_redispatch

      - name: Exercise served context-source adoption and pre-provider refusal
        working-directory: harness
        run: $GITHUB_WORKSPACE/harness/tools/exact-gate.sh - cargo test --locked -j 2 --package sts2-harness --test runtime_v4_executable_composition -- --ignored --exact served_workflow_adopts_context_source_before_managed_decision

      - name: Exercise served cancellation reconciliation against pinned peers
        working-directory: harness
        run: $GITHUB_WORKSPACE/harness/tools/exact-gate.sh - cargo test --locked -j 2 --package sts2-harness --test runtime_v4_executable_composition -- --ignored --exact served_cancel_reconciles_an_accepted_unsettled_action

      - name: Exercise served peer-negative and authored-graph acceptance
        working-directory: harness
        run: $GITHUB_WORKSPACE/harness/tools/exact-gate.sh - cargo test --locked -j 2 --package sts2-harness --test runtime_v4_executable_composition -- --ignored --exact served_peer_acceptance_rejects_bad_bindings_and_tracks_authored_graph

      - name: Exercise served context receipt recovery after process restart
        working-directory: harness
        run: $GITHUB_WORKSPACE/harness/tools/exact-gate.sh - cargo test --locked -j 2 --package sts2-harness --test runtime_v4_executable_composition -- --ignored --exact served_workflow_recovers_context_receipt_after_process_restart

      - name: Require the pinned peers to serve the recovery sideband contract
        working-directory: harness
        env:
          STS2_MCP_BINARY: ${{ github.workspace }}/mcp/target/debug/sts2-mcp-server
          STS2_GATEWAY_PEER_ROOT: ${{ github.workspace }}/gateway
          STS2_MCP_PEER_ROOT: ${{ github.workspace }}/mcp
        run: |
          "$GITHUB_WORKSPACE/harness/tools/exact-gate.sh" - cargo test --locked -j 2 --package sts2-harness --test runtime_peer_recovery_sideband -- --ignored --exact configured_mcp_peer_serves_the_watchdog_recovery_sideband
          "$GITHUB_WORKSPACE/harness/tools/exact-gate.sh" - cargo test --locked -j 2 --package sts2-harness --test runtime_peer_recovery_sideband -- --ignored --exact declared_peers_carry_one_recovery_frame_contract

      - name: Exercise the shipped host-lease campaign downstream
        working-directory: harness
        run: |
          binary=$(cargo test --locked -j 2 --package sts2-harness --test synthetic_mod_server --no-run \
            --message-format=json | grep -o '"executable":"[^"]*synthetic_mod_server-[^"]*"' | tail -n1 | cut -d'"' -f4)
          test -x "$binary"
          STS2_SYNTHETIC_MOD_SERVER_BINARY="$binary" "$GITHUB_WORKSPACE/harness/tools/exact-gate.sh" - cargo test --locked -j 2 --package sts2-harness --test host_lease_control_served -- --ignored --exact the_env_configured_campaign_downstream_answers_a_signed_install

      - name: Exercise hostile startup and cancellation cleanup regressions
        working-directory: harness
        run: |
          cargo test --locked -j 2 --package sts2-harness --test runtime_startup
          cargo test --locked -j 2 --package sts2-harness --test exo_cleanup

      - name: Show owned-process diagnostics
        if: failure()
        run: |
          if test -d "$RUNNER_TEMP/runtime-peer-contract"; then
            find "$RUNNER_TEMP/runtime-peer-contract" -type f -maxdepth 2 -print -exec sed -n '1,160p' {} \;
          fi
