name: Exo process oracle

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  STS2_EXO_TEST_SOURCE: ${{ github.workspace }}/target/exo-test-source

concurrency:
  group: exo-process-oracle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  exo-process-oracle:
    name: Exo process oracle (real pinned Exo, synthetic model/host)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Keep Corepack non-interactive: it must not block on a download prompt.
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read reviewed Exo source revision
        id: exo-revision
        run: |
          revision="$(sed -n 's/^pub const EXO_SOURCE_REVISION: &str = "\([0-9a-f]\{40\}\)";$/\1/p' crates/harness/src/exo/contract/mod.rs)"
          test "${#revision}" -eq 40
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"

      - name: Check out reviewed Exo source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: exoharness/exo
          ref: ${{ steps.exo-revision.outputs.revision }}
          path: target/exo-test-source
          persist-credentials: false

      - name: Install the pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.14.0'
          package-manager-cache: false

      - name: Install pinned Exo dependencies and stage the owned extension
        # Mirrors experiments/exo-agent/bridge/README.md: pnpm 10.26.2 installs the
        # pinned read-only Exo checkout; generated files stay under target/.
        run: |
          corepack pnpm@10.26.2 --dir target/exo-test-source install --frozen-lockfile
          mkdir -p target/exo-test-source/experiments/exo-agent/extension/src
          cp experiments/exo-agent/extension/src/*.ts \
            target/exo-test-source/experiments/exo-agent/extension/src/
          cp experiments/exo-agent/extension/package.json \
            target/exo-test-source/experiments/exo-agent/extension/
          corepack pnpm@10.26.2 --dir target/exo-test-source/experiments/exo-agent/extension run check

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --no-self-update

      - name: Build the isolated executor and the production bridge
        run: |
          CARGO_TARGET_DIR="$PWD/target/exo-executor" cargo build --locked \
            --manifest-path experiments/exo-agent/bridge/Cargo.toml
          cargo build --locked --config 'profile.dev.package.sha2.opt-level=3' \
            --package sts2-harness --bin sts2-exo-bridge

      - name: Run the real-Exo process oracle
        # Drives the real pinned Exo TypeScript runtime through the built executor,
        # replacing only the model service with a synthetic loopback endpoint and
        # the native game with the declared synthetic host. No provider, credential,
        # game, save or native instance is used.
        run: |
          STS2_EXO_TEST_NODE="$(command -v node)" \
            CARGO_TARGET_DIR="$PWD/target/exo-executor" \
            cargo test --locked --manifest-path experiments/exo-agent/bridge/Cargo.toml \
            --test process_oracle -- --ignored

      - name: Run the real-Exo duplex lookup oracle
        run: |
          STS2_EXO_TEST_NODE="$(command -v node)" \
            CARGO_TARGET_DIR="$PWD/target/exo-executor" \
            cargo test --locked --manifest-path experiments/exo-agent/bridge/Cargo.toml \
            --test lookup_oracle -- --ignored

      - name: Run the real-Exo fault matrix and run isolation
        # Extends the lane with #148 T2/T3: the admission fault matrix (schema/pin/identity), a
        # lost model reply, restart determinism and concurrent-run isolation. Same synthetic
        # loopback model and synthetic host; no provider, credential, game or native instance.
        run: |
          STS2_EXO_TEST_NODE="$(command -v node)" \
            CARGO_TARGET_DIR="$PWD/target/exo-executor" \
            cargo test --locked --manifest-path experiments/exo-agent/bridge/Cargo.toml \
            --test fault_oracle -- --ignored

      - name: Run the real-Exo bound and turn-budget oracle
        # Extends the lane with #148's remaining source-only halves: writer-side back-pressure at
        # the bridge's 131072-byte request bound and the executor's 160 KiB read bound, plus the
        # `timeout_millis` and `max_output_tokens` turn budgets. Same synthetic loopback model and
        # synthetic host; no provider, credential, game or native instance.
        run: |
          STS2_EXO_TEST_NODE="$(command -v node)" \
            CARGO_TARGET_DIR="$PWD/target/exo-executor" \
            cargo test --locked --manifest-path experiments/exo-agent/bridge/Cargo.toml \
            --test bound_oracle -- --ignored

      - name: Assert the fault report names the pinned revision
        env:
          EXO_REVISION: ${{ steps.exo-revision.outputs.revision }}
        run: |
          test -s target/exo-fault-report.json
          test "$(jq -r .exo_revision target/exo-fault-report.json)" = "$EXO_REVISION"
          test "$(jq -r .full_runtime_admission target/exo-fault-report.json)" = "false"

      - name: Assert the bounded evidence report names the pinned revision
        env:
          EXO_REVISION: ${{ steps.exo-revision.outputs.revision }}
        run: |
          test -s target/exo-smoke-report.json
          test "$(jq -r .exo_revision target/exo-smoke-report.json)" = "$EXO_REVISION"
          test "$(jq -r .full_runtime_admission target/exo-smoke-report.json)" = "false"

      - name: Assert the bound and budget report names the pinned revision
        env:
          EXO_REVISION: ${{ steps.exo-revision.outputs.revision }}
        run: |
          test -s target/exo-bound-report.json
          test "$(jq -r .exo_revision target/exo-bound-report.json)" = "$EXO_REVISION"
          test "$(jq -r .full_runtime_admission target/exo-bound-report.json)" = "false"
          test "$(jq -r '.boundaries.executor_read_bound_bytes' target/exo-bound-report.json)" = "163840"
          test "$(jq -r '.boundaries.bridge_request_parse_bound_bytes' target/exo-bound-report.json)" = "131072"

      - name: Assert the duplex lookup report records the round trips
        # The other three oracle legs each assert on the report their test writes; this
        # leg's report is the only one nothing downstream read, so a dropped `lookup_oracle`
        # invocation left the step green with no evidence. Same synthetic model/host: no
        # provider, credential, game, save or native instance is involved.
        env:
          EXO_REVISION: ${{ steps.exo-revision.outputs.revision }}
        run: |
          test -s target/exo-lookup-oracle-report.json
          test "$(jq -r .exo_revision target/exo-lookup-oracle-report.json)" = "$EXO_REVISION"
          test "$(jq -r .evidence target/exo-lookup-oracle-report.json)" = "confirmed-real-pinned-Exo-synthetic-model-no-game"
          test "$(jq -r .model_requests target/exo-lookup-oracle-report.json)" = "3"
          test "$(jq -r .tool_round_trips target/exo-lookup-oracle-report.json)" = "2"
          test "$(jq -r .complete_tool_payload target/exo-lookup-oracle-report.json)" = "true"
          test "$(jq -r '.rejected_feedback_cases | length' target/exo-lookup-oracle-report.json)" = "2"
          test "$(jq -r .maximum_source_bytes target/exo-lookup-oracle-report.json)" = "65536"
          test "$(jq -r .maximum_source_turns target/exo-lookup-oracle-report.json)" = "24"

      - name: Upload the bounded process evidence report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exo-process-oracle-report
          path: |
            target/exo-smoke-report.json
            target/exo-fault-report.json
            target/exo-bound-report.json
            target/exo-lookup-oracle-report.json
          if-no-files-found: warn
          retention-days: 7
