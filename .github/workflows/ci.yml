name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  STS2_EXO_TEST_SOURCE: ${{ github.workspace }}/target/exo-test-source

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust quality gates
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read reviewed Exo source revision
        id: exo-revision
        run: |
          revision="$(sed -n 's/^pub const EXO_SOURCE_REVISION: &str = "\([0-9a-f]\{40\}\)";$/\1/p' crates/harness/src/exo/contract/mod.rs)"
          test "${#revision}" -eq 40
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"

      - name: Check out reviewed Exo source for lifecycle fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: exoharness/exo
          ref: ${{ steps.exo-revision.outputs.revision }}
          path: target/exo-test-source
          persist-credentials: false

      - name: Verify whitespace and fair-play source
        run: |
          git diff --check
          grep -Fxq 'include!("sandbox_validator.rs");' crates/harness/src/exo/sandbox.rs
          grep -Fq 'fn is_privileged_key(' crates/harness/src/exo/sandbox_validator.rs
          if grep -REn 'std::process|Command::|TcpStream' crates/harness/src/exo; then exit 1; fi

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt --no-self-update

      - name: Verify copied POC artifact checksums
        run: (cd protocol-artifact/poc-v1 && sha256sum -c SHA256SUMS)

      - name: Verify frozen runtime artifact checksums
        run: |
          (cd protocol-artifact/runtime-v1 && sha256sum -c SHA256SUMS)
          (cd protocol-artifact/runtime-v2 && sha256sum -c SHA256SUMS)

      - name: Verify every copied protocol artifact inventory
        # Discovers every SHA256SUMS under protocol-artifact/ so a profile copied later
        # (for example runtime-v4-expert or runtime-v4-expert-action) cannot be missed.
        run: |
          inventories=$(find protocol-artifact -mindepth 2 -name SHA256SUMS -type f | LC_ALL=C sort)
          test -n "$inventories"
          for inventory in $inventories; do
            (cd "$(dirname "$inventory")" && sha256sum -c SHA256SUMS)
          done

      - name: Validate full M10 manifest schema and quarantine gate
        run: cargo test --package sts2-patch-diff --test patch_manifest --locked

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Check documentation links
        run: RUSTDOCFLAGS="-D rustdoc::broken_intra_doc_links -D rustdoc::private_intra_doc_links -D rustdoc::redundant_explicit_links --document-private-items" cargo doc --package sts2-harness --no-deps --locked

      - name: Run Rust tests
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Run doctests
        run: cargo test --workspace --doc --all-features --locked

  windows-check:
    name: Windows cross-compilation check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain and the Windows target
        run: |
          rustup toolchain install 1.97.1 --profile minimal --no-self-update
          rustup target add --toolchain 1.97.1 x86_64-pc-windows-gnu

      - name: Install the mingw cross linker
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      # Check only: this lane exists to prove the library still compiles for Windows, not to
      # claim it behaves correctly there. Warnings are not denied because unix-gated modules
      # leave dead code on this target; that cleanup is separate.
      - name: Check the workspace for Windows
        run: cargo check --workspace --all-features --locked --target x86_64-pc-windows-gnu

      # The documentation gate in the `rust` job runs on this Linux runner, where the
      # `#[cfg(windows)]` surface of `worker_endpoint.rs` is compiled out: a broken intra-doc
      # link inside it cannot fail that gate, and `cargo doc` never parses the body. This target
      # is already installed above for `cargo check`, and the mingw cross linker is required
      # here too — the build script of a workspace dependency invokes the C compiler for this
      # target before any lint runs.
      #
      # `dead_code` is allowed for this target only, for the reason the check step above records:
      # unix-gated modules leave dead code on a Windows target, so those warnings are noise here
      # and the three rustdoc denies are what this step enforces. Acceptance is still read from
      # the log rather than the step conclusion — a misspelled deny is an inert `unknown lint`
      # diagnostic and still exits 0, so a green conclusion alone is not evidence.
      - name: Document the Windows-target code the quality-gate job compiles out
        run: |
          set -o pipefail
          log=target/windows-doc.log
          status=0
          RUSTDOCFLAGS="-A dead_code -D rustdoc::broken_intra_doc_links -D rustdoc::private_intra_doc_links -D rustdoc::redundant_explicit_links --document-private-items" \
            cargo doc --package sts2-harness --no-deps --locked --target x86_64-pc-windows-gnu 2>&1 | tee "$log" || status=$?
          errors=$(awk '/^error/{count++} END{print count+0}' "$log")
          unknown=$(awk '/unknown lint/{count++} END{print count+0}' "$log")
          documented=$(awk '/Generated .*doc\/sts2_harness\/index.html/{count++} END{print count+0}' "$log")
          echo "windows-doc: exit=$status errors=$errors unknown_lints=$unknown documented=$documented"
          awk '/^(warning|error)/ {if (seen < 5) print "  diagnostic: " $0; seen++}' "$log"
          # No blanket `warning` count. Recomputing one was tried twice and measured wrong both
          # times: the dead-code warnings this target emits are re-reported at document time even
          # with the lint allowed, which is the same reason the check step above does not deny
          # warnings here. The conditions below still bind the properties that matter: the three
          # denies are fatal when they fire (exit), they are real lints and not inert misspellings
          # (unknown_lints), and this crate was genuinely documented on this target (documented).
          [ "$status" -eq 0 ] && [ "$errors" -eq 0 ] && [ "$unknown" -eq 0 ] && [ "$documented" -eq 1 ]

      - name: Build the provider bridges for Windows
        run: |
          cargo build --locked --release --target x86_64-pc-windows-gnu \
            --package sts2-harness --bin sts2-jev-bridge

  jev-arguments:
    name: JEV argument parsing (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --no-self-update

      - name: Run native parser and runtime admission tests
        shell: bash
        # Compile the actual shared modules, not a reimplementation or a Windows cross-check.
        # These modules use only std; no provider, credential, game or network call is exercised.
        run: |
          mkdir -p target
          printf '#[path = "../crates/harness/src/bin/runtime_support/runtime_v3_settings_local_bridge.rs"]\nmod local_bridge;\n' > target/jev-argument-tests.rs
          rustc +1.97.1 --edition=2024 --test target/jev-argument-tests.rs -o target/jev-argument-tests.exe
          ./target/jev-argument-tests.exe
