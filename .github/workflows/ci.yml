name: Continuous integration

on:
  merge_group:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify whitespace and fair-play source
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          git diff --check
          if [[ "$BASE_REVISION" =~ ^[0-9a-f]{40}$ && "$BASE_REVISION" != 0000000000000000000000000000000000000000 ]]; then
            git diff --check "$BASE_REVISION" HEAD
          else
            git show --format= --check HEAD
          fi
          grep -Fxq 'include!("sandbox_validator.rs");' crates/harness/src/exo/sandbox.rs
          grep -Fq 'fn is_privileged_key(' crates/harness/src/exo/sandbox_validator.rs
          if grep -REn 'std::process|Command::|TcpStream' crates/harness/src/exo; then exit 1; fi

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt --no-self-update

      - name: Verify copied POC artifact checksums
        run: (cd protocol-artifact/poc-v1 && sha256sum -c SHA256SUMS)

      - name: Verify frozen runtime artifact checksums
        run: |
          (cd protocol-artifact/runtime-v1 && sha256sum -c SHA256SUMS)
          (cd protocol-artifact/runtime-v2 && sha256sum -c SHA256SUMS)
      - name: Validate full M10 manifest schema and quarantine gate
        run: cargo test --package sts2-patch-diff --test patch_manifest --locked

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Enforce repository policy
        run: cargo run --locked --package repo-policy -- --strict

      - name: Validate adopted standards bundle
        run: cargo run --locked --manifest-path standards/tools/standards-sync/Cargo.toml -- validate --root .

      - name: Enforce production restrictions through Clippy
        run: cargo clippy --workspace --lib --bins --all-features --locked -- -D warnings -F clippy::unwrap_used -F clippy::expect_used -F clippy::panic -F clippy::todo -F clippy::unimplemented

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Run Rust documentation tests
        run: cargo test --workspace --all-features --doc --locked
