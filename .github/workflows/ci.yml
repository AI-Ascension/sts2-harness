name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref }}
          persist-credentials: false

      - name: Verify quarantined M10 manifest and fair-play source
        run: |
          git diff --check
          jq -e '.manifest_version == "sts2-patch-manifest-v1" and .quarantine.status == "quarantined" and (.diffs | has("build") and has("data") and has("ui") and has("actions") and has("schema"))' docs/research/sts2-expert-state-package/data/build-manifest.json >/dev/null
          jq -e '.["$id"] == "sts2-patch-manifest-v1" and .additionalProperties == false' patch-manifest.schema.json >/dev/null
          grep -Fq 'is_privileged_key' crates/harness/src/exo/sandbox.rs
          if grep -REn 'std::process|Command::|TcpStream' crates/harness/src/exo; then exit 1; fi

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt --no-self-update

      - name: Verify copied POC artifact checksums
        run: (cd protocol-artifact/poc-v1 && sha256sum -c SHA256SUMS)

      - name: Verify frozen runtime artifact checksums
        run: |
          (cd protocol-artifact/runtime-v1 && sha256sum -c SHA256SUMS)
          (cd protocol-artifact/runtime-v2 && sha256sum -c SHA256SUMS)

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Commit Rust formatting
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply rustfmt"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_HEAD_REF}"

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --all-targets --all-features --locked
