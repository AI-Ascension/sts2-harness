[limits]
rust_production_preferred = 300
rust_production_max = 400
rust_test_preferred = 400
rust_test_max = 600
csharp_production_preferred = 250
csharp_production_max = 350
csharp_test_preferred = 350
csharp_test_max = 500
workflow_preferred = 160
workflow_max = 200
markdown_preferred = 500
markdown_max = 700

# Exact repository-relative paths only. Every exception needs a durable reason.
[exemptions]
"crates/harness/src/execution/store_ops.rs" = "The operation ledger is a single transaction-state module; its 334-line implementation is below the hard limit and is covered by the durable operation fault matrix."
"crates/harness/src/execution/store_provider.rs" = "The provider reservation ledger is a single transaction-state module; its 336-line implementation is below the hard limit and keeps reservation transitions reviewable together."
"crates/harness/src/execution/types_records.rs" = "The durable record/error vocabulary is kept together to preserve cross-record invariants; its 331-line implementation is below the hard limit."
"crates/harness/tests/execution_store.rs" = "The store integration fixture exercises the complete legacy recovery matrix in one deterministic suite; its 442-line test remains below the hard limit."
"crates/harness/src/workflow/runtime.rs" = "The strict reducer keeps cursor, guard, loop, and terminal transitions together for one auditable state machine; its 314-line implementation remains below the hard limit."
"crates/harness/src/workflow/dynamic.rs" = "The dynamic plan registry, validator, and deterministic pure executor are reviewed as one bounded planning boundary; its 314-line implementation remains below the hard limit."
"crates/harness/src/workflow/provider.rs" = "The provider registry, typed context projection, and reservation ledger share one budget boundary; its 315-line implementation remains below the hard limit."
