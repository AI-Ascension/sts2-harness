[project.required_preambles]
# The active changelog lost its title, preamble and `## Unreleased` heading
# once already, through a conflict resolution that every gate accepted: a
# changelog with no title has *fewer* nonblank lines, so the size gate scores
# the deletion as an improvement. These markers restore the structural
# assertion that actually covers it. Closes #614.
"CHANGELOG.md" = { markers = ["# Changelog", "## Unreleased"] }

[limits]
rust_production_preferred = 300
rust_production_max = 400
rust_test_preferred = 400
rust_test_max = 600
csharp_production_preferred = 250
csharp_production_max = 350
csharp_test_preferred = 350
csharp_test_max = 500
workflow_preferred = 160
workflow_max = 200
markdown_preferred = 500
markdown_max = 700

# Exact repository-relative paths only. Every exception needs a durable reason.
[exemptions]
".github/workflows/runtime-peer-contract.yml" = "The runtime-peer-contract lane keeps every served_* step's own `runner.temp` evidence directory beside the step that needs it, because a job-level env cannot read `runner.temp`; its 168 nonblank lines remain below the 200-line workflow hard limit."

"crates/harness/src/execution/store_ops.rs" = "The operation ledger is a single transaction-state module; its 270-line implementation is below the hard limit and is covered by the durable operation fault matrix."
"crates/harness/src/execution/store_provider.rs" = "The provider reservation ledger is a single transaction-state module; its 185-line implementation is below the hard limit and keeps reservation transitions reviewable together."
"crates/harness/src/execution/types_records.rs" = "The durable record/error vocabulary is kept together to preserve cross-record invariants; its 245-line implementation is below the hard limit."
"crates/harness/tests/execution_store.rs" = "The store integration fixture exercises the complete legacy recovery matrix in one deterministic suite; its 316-line test remains below the hard limit."
"crates/harness/src/workflow/runtime.rs" = "The strict reducer keeps cursor, guard, loop, and terminal transitions together for one auditable state machine; its 367-line implementation remains below the hard limit."
"crates/harness/src/workflow/dynamic.rs" = "The dynamic plan registry, validator, and deterministic pure executor are reviewed as one bounded planning boundary; its 349-line implementation remains below the hard limit."
"crates/harness/src/workflow/provider.rs" = "The provider registry, typed context projection, and reservation ledger share one budget boundary; its 356-line implementation remains below the hard limit."
"crates/harness/src/exo_admission.rs" = "The read-only trusted and independently inspected identity accessors stay beside Exo plan validation so profile admission cannot confuse declarations with observations; its 317 nonblank lines remain below the 400-line hard limit."
"crates/harness/src/management/production.rs" = "The served factory keeps profile-binding admission, provider-token preparation and the runtime/session handoff together so the pre-effect refusal boundary remains reviewable; its 349 nonblank lines remain below the 400-line hard limit."
"crates/harness/src/management/production/session.rs" = "The session launch and decision path keeps one-shot provider-token consumption, legacy-only fallback and exact profile rechecks at their effect boundary; its 324 nonblank lines remain below the 400-line hard limit."
"crates/harness/src/management/production_policy_tests.rs" = "The existing session-construction fixture records the provider admission token and terminal-launch state required by the production struct, while keeping legacy-session tests explicit; its 402 nonblank lines remain below the 600-line test hard limit."
"crates/harness/src/management/http.rs" = "The management HTTP server keeps the accept loop, the per-connection worker and the reporting port that observes an undeliverable response together, because the report is only attributable if it is raised at the accept site that still holds the peer address. Its size is stated as its 323 nonblank lines, which remain below the 400-line hard limit. The parser reads only the `its <N> nonblank lines` form, so that exact wording is what carries the claim. The per-request serving body moved to `http_lifecycle.rs` under #820, which also owns the request-lifecycle markers, so this file holds only the accept loop and the worker dispatch."
"crates/harness/src/management/http_lifecycle_log.rs" = "The management request-lifecycle log keeps its clock, label and redaction contract beside the three terminal markers it emits (`request_end`, `request_abandoned`, `request_unreadable`, `request_panicked`), because what may appear in a line and when a line is emitted are one security decision: a security review has to read both together to confirm that nothing a caller controls reaches stderr; its 308 nonblank lines remain below the 400-line hard limit."
"crates/harness/src/bin/sts2-astra-bridge.rs" = "The Astra bridge keeps bounded process execution, capture sideband emission, and decision validation together so the executable remains one auditable provider boundary; its 313-line implementation remains below the hard limit."
"crates/harness/src/exo/protocol.rs" = "The Exo protocol adapter keeps request bounds, transport lifecycle, and capture sideband transitions together so provider admission remains reviewable as one boundary; its 344-line implementation remains below the hard limit. The 2026-10-04 wave for #140 grew it by the dispatch-enforced `tool_catalog` field and its fail-closed default; the reviewed allowlist is bound here rather than re-derived per request."
"crates/harness/src/context_control/membership_resolution.rs" = "Membership resolution keeps requested-item admission, scope enforcement, disposition expansion, exclusion validation, pre-dispatch gates, and revalidation together so the decision and its fail-closed checks stay reviewable as one pipeline; its 379-line implementation remains below the hard limit."
"crates/harness/src/exo/protocol/request.rs" = "The Exo request module keeps legacy/map/management constructors and their bounded strict request conversion together so all provider profiles share one validation boundary; its 350-line implementation remains below the hard limit."
"crates/harness/src/provider_session/broker_snapshot.rs" = "The provider snapshot restore module keeps schema validation, owner rotation, tombstone ordering, unknown-turn recovery and metadata-only invariants together; its 369-line implementation remains below the hard limit."
"crates/harness/src/provider_session/broker.rs" = "The provider-session registry keeps owner admission, lifecycle fencing, prepared-turn and history bookkeeping, and the allowlisted Debug projection of its own fields together so a single audited boundary owns every formatting path that could publish the owner authorization token or registry internals; its 333-line implementation remains below the hard limit."
"crates/harness/src/provider_session/common.rs" = "The provider session common module keeps shared bounded constants, strict timestamp validation, digest helpers and expiry semantics together for every broker operation; its 339-line implementation remains below the hard limit."
