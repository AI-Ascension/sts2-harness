ignored_directories = [
  ".git",
  ".idea",
  ".vscode",
  "bin",
  "node_modules",
  "obj",
  "target",
  "vendor",
]
ignored_path_prefixes = []

[limits]
rust_production_preferred = 300
rust_production_max = 400
rust_test_preferred = 400
rust_test_max = 600
csharp_production_preferred = 250
csharp_production_max = 350
csharp_test_preferred = 350
csharp_test_max = 500
workflow_preferred = 160
workflow_max = 200
markdown_preferred = 500
markdown_max = 700

# Exact repository-relative paths only. Every exception needs a durable reason.
[exemptions]
"crates/harness/src/exo/protocol.rs" = "Handwritten Exo transport contract remains one reviewed adapter boundary; split with the next provider API revision."
"crates/harness/src/exo/sandbox.rs" = "Handwritten fair-play sanitizer remains one reviewed security boundary; split with the next projection contract revision."
"crates/harness/src/evaluation.rs" = "Handwritten evaluation aggregation remains one evidence unit; split with the next evaluation schema revision."
"crates/harness/src/replay.rs" = "Handwritten replay projection remains one evidence unit; split with the next replay schema revision."
