# Operator-owned values only. Keep credentials and the copied file outside this repository.
# Reviewed public Exo audit revision. Replace only with another exact reviewed commit hash.
revision = "7801005e6a1ab77008a05dbba80e0a2a7a56e35d"
endpoint = "REPLACE_WITH_OPERATOR_OWNED_EXO_ENDPOINT"
request_timeout_millis = 120000
max_request_bytes = 131072
max_response_bytes = 8192
# The host visible_seed is omitted from requests unless this is true (it may be the real PRNG
# seed; that is unverified). Runtime override: STS2_EXO_FORWARD_VISIBLE_SEED=true.
forward_visible_seed = false

# When the operator uses the built-in process seam, configure its executable, direct arguments,
# and environment-name allowlist in the host composition. The bridge receives one JSON request on
# stdin and must return one bounded JSON decision on stdout; no shell is invoked by the harness.

# The adapter emits only semantic decisions. Coordinates, raw input, shell, reflection, and
# privileged observation tools are intentionally not configurable here.
decision_schema = "sts2.exo-decision-v1"
