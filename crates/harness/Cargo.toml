[package]
name = "sts2-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["net"] }
uuid = { version = "=1.23.5", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
tokio = { workspace = true, features = ["net", "signal"] }
rustix = { version = "=1.1.4", features = ["event", "fs", "net", "process", "stdio"] }
subtle = { version = "=2.6.1", default-features = false }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }

[dev-dependencies]
jsonschema = { version = "=0.52.1", default-features = false }
rustix = { version = "=1.1.4", features = ["event", "fs", "pipe", "process"] }

[lints]
workspace = true
