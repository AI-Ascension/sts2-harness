[workspace]
members = ["tools/repo-policy", "tools/patch-diff", "crates/harness", "tools/sts2-expert-state-package"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.97.1"
version = "0.0.0"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
toml = "=1.1.4"
tokio = { version = "=1.53.1", default-features = false, features = ["io-util", "macros", "process", "rt", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
