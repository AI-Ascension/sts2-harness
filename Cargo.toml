[workspace]
members = [
    "tools/repo-policy",
    "tools/patch-diff",
    "crates/harness",
    "crates/windows-worker-boundary",
    "tools/sts2-expert-state-package",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.97.1"
version = "0.0.0"

[workspace.dependencies]
chacha20poly1305 = "=0.10.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
toml = "=1.1.5"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
rustix = { version = "=1.1.4", features = ["event", "fs", "net", "pipe", "process"] }
getrandom = "=0.3.4"
png = "=0.18.1"
sts2-protocol = { git = "https://github.com/AI-Ascension/sts2-protocol.git", rev = "0bc689eabc5542ede2b09b030d9ea32daa8a73e7" }
tokio = { version = "=1.53.1", default-features = false, features = ["io-util", "macros", "process", "rt", "time"] }
zeroize = "=1.9.0"
windows-sys = "=0.61.2"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
